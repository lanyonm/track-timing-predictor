name: Deploy to Production

# Prerequisite (one-time manual setup before this workflow can run):
#   1. aws iam create-open-id-connect-provider for token.actions.githubusercontent.com
#   2. cdk deploy TrackTimingBase TrackTimingStack-prod --context image_tag=prod-latest  (from CLI with human IAM user)
#   3. Add AWS_ACCOUNT_ID secret to the GitHub repo
#   4. In Settings > Environments > production, limit deployment branches to main
#      (the prod role only trusts jobs in this environment)

# Runs only after Tests succeeds for a push to main, and deploys the tested commit.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # Required for OIDC token exchange
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/track-timing-github-actions
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: track-timing-predictor
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:prod-latest \
            --push \
            .

      - name: Set up Python for CDK
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cdk/requirements.txt

      - name: Install CDK Python dependencies
        working-directory: cdk
        run: pip install --require-hashes -r requirements.txt

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2.1144.0  # keep compatible with aws-cdk-lib in cdk/requirements.in

      - name: Deploy CDK stacks
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: us-east-1
        run: |
          cdk deploy TrackTimingBase TrackTimingStack-prod \
            --require-approval never \
            --context image_tag=${{ github.event.workflow_run.head_sha }}
