name: Deploy to Production

# Prerequisite (one-time manual setup before this workflow can run):
#   1. aws iam create-open-id-connect-provider for token.actions.githubusercontent.com
#   2. cdk deploy TrackTimingBase TrackTimingStack-prod --context image_tag=prod-latest  (from CLI with human IAM user)
#   3. Add AWS_ACCOUNT_ID secret to the GitHub repo

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC token exchange
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/track-timing-github-actions
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: track-timing-predictor
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:prod-latest \
            --push \
            .

      - name: Set up Python for CDK
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cdk/requirements.txt

      - name: Install CDK Python dependencies
        working-directory: cdk
        run: pip install --require-hashes -r requirements.txt

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2.1144.0  # keep compatible with aws-cdk-lib in cdk/requirements.in

      - name: Deploy CDK stacks
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: us-east-1
        run: |
          cdk deploy TrackTimingBase TrackTimingStack-prod \
            --require-approval never \
            --context image_tag=${{ github.sha }}
