name: PR Environment

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main]

jobs:
  deploy-pr:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/track-timing-github-actions
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: track-timing-predictor
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --push \
            .

      - name: Set up Python for CDK
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cdk/requirements.txt

      - name: Install CDK Python dependencies
        working-directory: cdk
        run: pip install --require-hashes -r requirements.txt

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2.1144.0  # keep compatible with aws-cdk-lib in cdk/requirements.in

      - name: Deploy PR stack
        id: cdk-deploy
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: us-east-1
          ENV_NAME: pr-${{ github.event.pull_request.number }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cdk deploy TrackTimingStack-${ENV_NAME} \
            --exclusively \
            --require-approval never \
            --context env_name=${ENV_NAME} \
            --context image_tag=${IMAGE_TAG} \
            --outputs-file cdk-outputs.json

      - name: Comment PR with environment URL
        env:
          ENV_NAME: pr-${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FUNCTION_URL=$(jq -r ".\"TrackTimingStack-${ENV_NAME}\".FunctionUrl" cdk-outputs.json)
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "Preview environment deployed: ${FUNCTION_URL}"

  destroy-pr:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/track-timing-github-actions
          aws-region: us-east-1

      - name: Set up Python for CDK
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cdk/requirements.txt

      - name: Install CDK Python dependencies
        working-directory: cdk
        run: pip install --require-hashes -r requirements.txt

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2.1144.0  # keep compatible with aws-cdk-lib in cdk/requirements.in

      - name: Destroy PR stack
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: us-east-1
          ENV_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          cdk destroy TrackTimingStack-${ENV_NAME} \
            --force \
            --context env_name=${ENV_NAME} \
            --context image_tag=placeholder
