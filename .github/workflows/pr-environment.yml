name: PR Environment

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main]

# Serialise each PR's deploys and its destroy, so a close can't race a deploy.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy-pr:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/track-timing-github-actions-pr
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: track-timing-predictor
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --push \
            .

      - name: Set up Python for CDK
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cdk/requirements.txt

      - name: Install CDK Python dependencies
        working-directory: cdk
        run: pip install --require-hashes -r requirements.txt

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2.1144.0  # keep compatible with aws-cdk-lib in cdk/requirements.in

      - name: Deploy PR stack
        id: cdk-deploy
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: us-east-1
          ENV_NAME: pr-${{ github.event.pull_request.number }}
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
        run: |
          cdk deploy TrackTimingStack-${ENV_NAME} \
            --exclusively \
            --require-approval never \
            --context env_name=${ENV_NAME} \
            --context image_tag=${IMAGE_TAG} \
            --outputs-file cdk-outputs.json

      - name: Comment PR with environment URL
        env:
          ENV_NAME: pr-${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FUNCTION_URL=$(jq -r ".\"TrackTimingStack-${ENV_NAME}\".FunctionUrl" cdk-outputs.json)
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "Preview environment deployed: ${FUNCTION_URL}"

  destroy-pr:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/track-timing-github-actions-pr
          aws-region: us-east-1

      - name: Set up Python for CDK
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cdk/requirements.txt

      - name: Install CDK Python dependencies
        working-directory: cdk
        run: pip install --require-hashes -r requirements.txt

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2.1144.0  # keep compatible with aws-cdk-lib in cdk/requirements.in

      - name: Destroy PR stack
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: us-east-1
          ENV_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          cdk destroy TrackTimingStack-${ENV_NAME} \
            --force \
            --context env_name=${ENV_NAME} \
            --context image_tag=placeholder
