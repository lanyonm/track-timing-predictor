[project]
name = "track-timing-predictor"
version = "0.1.0"
description = "Predicts per-event start times for track cycling competitions on tracktiming.live"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
    "pydantic-settings>=2.0.0",
    "python-json-logger>=3.1.0",  # app/main.py imports pythonjsonlogger.json
    "boto3>=1.34.0",
    "mangum>=0.19.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "moto[dynamodb]>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["specs", ".specify", "docs", "plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# StrEnum changes str()/format() of EventStatus members, which templates render
ignore = ["UP042"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Tests read small fixture files inside async tests
"tests/**" = ["ASYNC230"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
